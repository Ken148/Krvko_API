name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master

env:
  AZURE_WEBAPP_NAME: KrvkoAPI
  IMAGE_NAME: krvko_api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Krvko_API/Krvko_API.csproj

      - name: Build
        run: dotnet build Krvko_API/Krvko_API.csproj --configuration Release --no-restore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Krvko_API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/krvko_api:latest
            ${{ secrets.DOCKER_USERNAME }}/krvko_api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
  
    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          image: index.docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
